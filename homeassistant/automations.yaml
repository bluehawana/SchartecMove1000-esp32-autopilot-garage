# =============================================================================
#  Home Assistant automations - Schartec Move 1000 Autopilot
# =============================================================================
#  The ESP32 handles going OUT (presence -> open, passage -> close) entirely on
#  its own. These automations handle coming HOME, plus the safety nets.
#
#  Replace device_tracker.phone / notify.mobile_app_phone with your entities.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. ARRIVAL - the default, and the one I'd actually run.
#
# A pure GPS trigger is a bad idea on its own: phone geofences drift by
# 100-200m, so the door can swing open while you are still down the road and
# can't see it. One tap costs you nothing and removes the whole failure class.
# -----------------------------------------------------------------------------
- alias: "Garage - offer to open on arrival"
  id: garage_arrival_notify
  mode: single
  triggers:
    - trigger: zone
      entity_id: device_tracker.phone
      zone: zone.home
      event: enter
  conditions:
    - condition: state
      entity_id: cover.garage_door
      state: "closed"
  actions:
    - action: notify.mobile_app_phone
      data:
        title: "Home"
        message: "Open the garage?"
        data:
          actions:
            - action: "GARAGE_OPEN"
              title: "Open"
          # Stays put on the lock screen until you deal with it.
          push:
            interruption-level: time-sensitive

- alias: "Garage - handle open notification tap"
  id: garage_arrival_action
  mode: single
  triggers:
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: "GARAGE_OPEN"
  actions:
    - action: cover.open_cover
      target:
        entity_id: cover.garage_door

# -----------------------------------------------------------------------------
# 2. ARRIVAL - fully automatic, BY CAR (opt-in).
#
# "Someone is home" and "the car is coming home" are different facts. A phone
# sitting in the living room already satisfies a geofence and will never fire
# an enter event; a partner walking home fires one but needs no garage door.
#
# So we never trigger on presence alone. Two signals must agree:
#   a) THIS person's tracker crossed the home geofence, and
#   b) their phone is on the car stereo -> they are physically in the car
#
# (b) is the load-bearing one. It is what separates "a human arrived" from
# "a vehicle arrived", and it kills GPS drift as a failure mode.
#
# Set zone.home's radius to ~100-150m, NOT the 250m you would need to have the
# door finished on arrival. There is an off-street parking space in front of
# this garage, so waiting a few seconds costs nothing - you are on your own spot,
# not blocking anyone. A smaller radius means the door spends less time open and
# unattended. Departure needs anticipation; arrival does not.
# -----------------------------------------------------------------------------
- alias: "Garage - auto-open for returning household member (by car)"
  id: garage_arrival_car
  mode: single
  initial_state: false        # enable once you trust it
  triggers:
    # Any household member. Add or remove trackers here.
    - trigger: zone
      entity_id:
        - device_tracker.owner_phone
        - device_tracker.partner_phone
      zone: zone.home
      event: enter
  variables:
    # Which person triggered, and therefore which Bluetooth sensor to check.
    # Checking the WRONG person's phone is how you open the door for someone
    # who is sitting in the living room.
    bt_sensor: >
      {{ {'device_tracker.owner_phone':   'sensor.owner_phone_bluetooth_connection',
          'device_tracker.partner_phone': 'sensor.partner_phone_bluetooth_connection'
         }.get(trigger.entity_id, 'sensor.does_not_exist') }}
    who: "{{ trigger.to_state.name }}"
  conditions:
    - condition: state
      entity_id: cover.garage_door
      state: "closed"
    # That specific person is in the car. Toyota Prius+ pairs over plain
    # Bluetooth - check Settings > Bluetooth for the exact pairing name.
    - condition: template
      value_template: "{{ 'Toyota' in (states(bt_sensor) | default('', true)) }}"
    # The bay is empty, so a car genuinely needs to get in.
    - condition: state
      entity_id: binary_sensor.garage_car_present
      state: "off"
    - condition: template
      value_template: >
        {{ as_timestamp(now())
           - as_timestamp(states.cover.garage_door.last_changed) > 300 }}
  actions:
    - action: cover.open_cover
      target:
        entity_id: cover.garage_door
    - action: notify.mobile_app_phone
      data:
        message: "Opening the garage - {{ who }} is home."

# -----------------------------------------------------------------------------
# 2b. ARRIVAL - fully automatic, BY BIKE (opt-in).
#
# A bike has no Bluetooth and carries no phone of its own, so the car trick
# does not transfer. Instead we use the companion app's activity recognition:
# the phone knows it is being carried on a bicycle.
#
# Bikes are slower, so the geofence has more time to work - but they also
# approach from paths a car can't use. Tune the zone radius separately.
# -----------------------------------------------------------------------------
- alias: "Garage - auto-open for returning bike"
  id: garage_arrival_bike
  mode: single
  initial_state: false
  triggers:
    - trigger: zone
      entity_id:
        - device_tracker.owner_phone
        - device_tracker.partner_phone
      zone: zone.home
      event: enter
  variables:
    activity_sensor: >
      {{ {'device_tracker.owner_phone':   'sensor.owner_phone_activity',
          'device_tracker.partner_phone': 'sensor.partner_phone_activity'
         }.get(trigger.entity_id, 'sensor.does_not_exist') }}
  conditions:
    - condition: state
      entity_id: cover.garage_door
      state: "closed"
    # iOS reports "Cycling"; Android reports "on_bicycle". Accept either.
    - condition: template
      value_template: >
        {{ states(activity_sensor) in ['Cycling', 'on_bicycle'] }}
    # The bike is genuinely out, so it needs to come back in.
    - condition: state
      entity_id: binary_sensor.garage_bike_present
      state: "off"
  actions:
    - action: cover.open_cover
      target:
        entity_id: cover.garage_door

# -----------------------------------------------------------------------------
# 2c. "Is the car / bike back?" - the living-room question.
#
# You are inside, someone is still out, and you want to know whether they
# actually made it home. Presence sensing answers a question a phone cannot:
# the vehicle itself is what got detected, not a person carrying a handset.
# -----------------------------------------------------------------------------
- alias: "Garage - notify when car gets home"
  id: garage_car_home_notify
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.garage_car_present
      from: "off"
      to: "on"
      for: "00:00:15"
  actions:
    - action: notify.mobile_app_phone
      data:
        message: "Car is back in the garage."

- alias: "Garage - notify when bike gets home"
  id: garage_bike_home_notify
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.garage_bike_present
      from: "off"
      to: "on"
      for: "00:00:30"
  actions:
    - action: notify.mobile_app_phone
      data:
        message: "Bike is back in the garage."

# -----------------------------------------------------------------------------
# 3. SAFETY NET - door left open.
#
# The ESP32 deliberately leaves the door open if nobody passed through the
# beam. That is the correct behaviour, but you still want to be told.
# -----------------------------------------------------------------------------
- alias: "Garage - warn if left open"
  id: garage_left_open
  mode: single
  triggers:
    - trigger: state
      entity_id: cover.garage_door
      to: "open"
      for: "00:10:00"
  actions:
    - action: notify.mobile_app_phone
      data:
        title: "Garage still open"
        message: "Open for 10 minutes. Close it?"
        data:
          actions:
            - action: "GARAGE_CLOSE"
              title: "Close"
    - repeat:
        # Nag every 10 min while it stays open, up to an hour.
        count: 5
        sequence:
          - delay: "00:10:00"
          - condition: state
            entity_id: cover.garage_door
            state: "open"
          - action: notify.mobile_app_phone
            data:
              message: "Garage is STILL open."

- alias: "Garage - handle close notification tap"
  id: garage_close_action
  mode: single
  triggers:
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: "GARAGE_CLOSE"
  actions:
    - action: cover.close_cover
      target:
        entity_id: cover.garage_door

# -----------------------------------------------------------------------------
# 4. NIGHT GUARD - disable presence-triggered opening overnight.
#
# The inner approach sensor is safe (you're already inside), but there is no
# reason for it to be live at 03:00.
# -----------------------------------------------------------------------------
- alias: "Garage - auto-open off at night"
  id: garage_autoopen_night_off
  triggers:
    - trigger: time
      at: "23:00:00"
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.garage_auto_open

- alias: "Garage - auto-open on in the morning"
  id: garage_autoopen_morning_on
  triggers:
    - trigger: time
      at: "06:00:00"
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.garage_auto_open

# -----------------------------------------------------------------------------
# 5. AWAY GUARD - never let the door sit open when nobody is home.
# -----------------------------------------------------------------------------
- alias: "Garage - close when everyone leaves"
  id: garage_close_on_away
  mode: single
  triggers:
    - trigger: state
      entity_id: group.family
      to: "not_home"
      for: "00:05:00"
  conditions:
    - condition: state
      entity_id: cover.garage_door
      state: "open"
    # Never move the door if the beam says something is in the doorway.
    - condition: state
      entity_id: binary_sensor.garage_doorway_beam_blocked
      state: "off"
  actions:
    - action: notify.mobile_app_phone
      data:
        message: "Everyone left - closing the garage."
    - action: cover.close_cover
      target:
        entity_id: cover.garage_door

# -----------------------------------------------------------------------------
# 6. iOS TRIGGERS
#
# Entry point for Apple Shortcuts "personal automations". The best of these by
# far is CarPlay connect: it fires the moment you start the car, it cannot fire
# when you are not in the driver's seat, and it happens while you are still
# doing up your seatbelt - which is exactly the head start the door needs.
#
# local_only: true means this only works on the home network. That is correct
# for departures (you are in the garage, on Wi-Fi) and it keeps the webhook
# unreachable from the internet. Arrivals use the zone triggers above instead.
#
# Generate a long random webhook_id and keep it out of git:
#   python3 -c "import secrets; print(secrets.token_urlsafe(32))"
# -----------------------------------------------------------------------------
- alias: "Garage - open via iOS Shortcut"
  id: garage_ios_webhook
  mode: single
  triggers:
    - trigger: webhook
      webhook_id: !secret garage_webhook_id
      allowed_methods: [POST]
      local_only: true
  actions:
    - action: button.press
      target:
        entity_id: button.garage_speculative_open

# -----------------------------------------------------------------------------
# 7. INDOOR EARLY TRIGGER - a sensor in the hallway or living room.
#
# This is the earliest useful signal (~30s of head start), and also the least
# certain - people cross a living room all evening. It is only safe because a
# speculative open undoes itself after 90s.
#
# Two guards keep it sane:
#   - "departure armed" (below), so it is not live all evening
#   - a vehicle must actually be home, or there is nothing to leave in
#
# Put the sensor in the HALLWAY OUTSIDE THE GARAGE DOOR if you can. It fires
# far less often than a living-room sensor and still gives 10-15s of margin.
# -----------------------------------------------------------------------------
- alias: "Garage - early open from indoor approach"
  id: garage_indoor_early
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.hallway_presence
      from: "off"
      to: "on"
  conditions:
    - condition: state
      entity_id: input_boolean.garage_departure_armed
      state: "on"
    - condition: state
      entity_id: cover.garage_door
      state: "closed"
    # Nothing to leave in? Then this is not a departure.
    - condition: or
      conditions:
        - condition: state
          entity_id: binary_sensor.garage_car_present
          state: "on"
        - condition: state
          entity_id: binary_sensor.garage_bike_present
          state: "on"
  actions:
    - action: button.press
      target:
        entity_id: button.garage_speculative_open

- alias: "Garage - arm departure window on weekday mornings"
  id: garage_arm_departure
  triggers:
    - trigger: time
      at: "06:30:00"
  conditions:
    - condition: time
      weekday: [mon, tue, wed, thu, fri]
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.garage_departure_armed

- alias: "Garage - disarm departure window"
  id: garage_disarm_departure
  triggers:
    - trigger: time
      at: "09:30:00"
    # Also disarm as soon as we actually leave - the window has served its job.
    - trigger: state
      entity_id: binary_sensor.garage_doorway_beam_blocked
      to: "on"
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.garage_departure_armed
