# =============================================================================
#  Schartec Move 1000 (Series 3) - Autopilot Garage
# =============================================================================
#  Drives the opener's O/S/C dry-contact terminal (Fig. 17 in the Series 3
#  manual) and adds the things the opener does not have: door position
#  feedback, presence-triggered opening, and close-after-passage.
#
#  All decision logic lives ON THE ESP32 on purpose. The door still behaves
#  correctly when Home Assistant or Wi-Fi is down.
#
#  Board: ESP32-WROOM (NOT WROVER - GPIO16/17 are used by PSRAM on WROVER)
#  See docs/hardware.md for the pinout and wiring.
# =============================================================================

substitutions:
  device_name: garage-schartec
  # How long the relay holds the O/S/C contact closed. The opener treats this
  # as a button press; 300-500ms is the sweet spot.
  pulse_length: 400ms
  # Gap after the doorway beam clears before the door is allowed to close.
  # Raise this if a long car's tail is still under the door when it starts.
  clear_dwell: 8s
  # If nobody passes through within this window, give up and leave it open.
  passage_timeout: 5min
  # Shorter leash for a SPECULATIVE open (triggered by the house door). If the
  # guess was wrong and nobody drives out, we close again rather than leave it.
  speculative_timeout: 90s
  # After a passage, how long we will wait for the garage to empty of PEOPLE
  # before giving up and leaving the door open. This is what stops the door
  # closing on you while you climb out of the car after driving in.
  occupancy_timeout: 10min
  # Extra settling time after the garage first reads empty. mmWave can briefly
  # lose a person who is standing still; this makes "empty" mean empty.
  empty_settle: 10s
  # Blocks auto-open from re-firing immediately after an auto-close.
  cycle_cooldown_ms: '60000'

esphome:
  name: ${device_name}
  on_boot:
    priority: 900
    then:
      # Never come out of a reboot with the door contact held closed.
      - switch.turn_off: osc_relay
      - switch.turn_off: buzzer

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} fallback"
    password: !secret fallback_password

captive_portal:
logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# --- LD2410 mmWave presence sensor (mounted inside, facing the door) --------
uart:
  id: uart_ld2410
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  uart_id: uart_ld2410

# --- BLE beacon tracking -----------------------------------------------------
# A cheap BLE tag zip-tied under the bike saddle (and one in the car glovebox)
# is how we answer "is the bike actually back?" - the bike has no Bluetooth of
# its own and carries no phone.
#
# NOTE: this pulls in the whole Bluedroid stack alongside Wi-Fi. Measured on
# ESPHome 2026.8.2: the build fits at RAM 56.9% / Flash 70.9%, leaving ~53 KB
# spare - but that is static allocation, not runtime heap under Wi-Fi/BLE
# coexistence. If the node proves unstable on real hardware, delete this
# section first; the bike tag is the only feature that depends on it.
esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 500ms
    active: false

globals:
  # millis() timestamp of the last O/S/C pulse, used for the cooldown.
  - id: last_cycle_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # True when we opened on a GUESS (house door) rather than a command.
  # A speculative open that goes unused closes itself again; a commanded open
  # is left alone. This is what lets us start opening 15s early without
  # leaving the door hanging open every time you fetch a screwdriver.
  - id: speculative_open
    type: bool
    restore_value: no
    initial_value: 'false'

# =============================================================================
#  Outputs
# =============================================================================
switch:
  # Dry contact across the two O/S/C terminals. Potential-free - never feed
  # voltage into this input.
  - platform: gpio
    id: osc_relay
    pin: GPIO26
    restore_mode: ALWAYS_OFF
    internal: true

  # Local piezo. Sounds BEFORE an unattended close starts moving the door.
  # The opener drives its own 24V hazard light during travel (Fig. 19).
  - platform: gpio
    id: buzzer
    pin: GPIO27
    restore_mode: ALWAYS_OFF
    internal: true

  # Kill switch for presence-triggered opening. Turn this off when you are
  # working in the garage, or the door opens every time you walk past.
  - platform: template
    id: auto_open_enabled
    name: "Garage Auto-Open"
    icon: mdi:motion-sensor
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # Kill switch for close-after-passage.
  - platform: template
    id: auto_close_enabled
    name: "Garage Auto-Close"
    icon: mdi:garage-alert
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# =============================================================================
#  Inputs
# =============================================================================
binary_sensor:
  # Reed at the fully-closed limit.
  - platform: gpio
    id: door_closed
    name: "Garage Closed Limit"
    device_class: garage_door
    pin:
      number: GPIO32
      mode: { input: true, pullup: true }
      inverted: true
    filters: [delayed_on_off: 100ms]
    on_press:
      - lambda: 'id(speculative_open) = false;'

  # Contact on the INTERNAL house -> garage door. This is the real "I am
  # leaving" signal, and it is the whole reason the experience feels instant:
  # it fires ~20s before you actually need the door, which more than covers
  # the ~15s the Move 1000 needs to travel 2400mm at 160mm/s.
  - platform: gpio
    id: house_door
    name: "Garage House Door"
    device_class: door
    pin:
      number: GPIO13
      mode: { input: true, pullup: true }
      inverted: true
    filters: [delayed_on_off: 200ms]
    on_press:
      - if:
          condition:
            and:
              - switch.is_on: auto_open_enabled
              - binary_sensor.is_on: door_closed
              - lambda: 'return (millis() - id(last_cycle_ms)) > ${cycle_cooldown_ms};'
          then:
            - logger.log: "House door - speculative open"
            - lambda: 'id(speculative_open) = true;'
            - script.execute: pulse_osc

  # Reed at the fully-open limit. Reaching it arms the auto-close watcher.
  - platform: gpio
    id: door_open
    name: "Garage Open Limit"
    pin:
      number: GPIO33
      mode: { input: true, pullup: true }
      inverted: true
    filters: [delayed_on_off: 100ms]
    on_press:
      - if:
          condition:
            switch.is_on: auto_close_enabled
          then:
            - script.execute: auto_close_watch

  # SECOND, INDEPENDENT beam across the doorway - NOT the opener's safety
  # photocell. The Schartec photocell stays wired only to the opener's own
  # safety loop so nothing we do here can compromise it. See docs/safety.md.
  - platform: gpio
    id: beam_blocked
    name: "Garage Doorway Beam Blocked"
    device_class: occupancy
    pin:
      number: GPIO25
      mode: { input: true, pullup: true }
      inverted: true
    filters: [delayed_on_off: 50ms]

  - platform: ld2410
    has_target:
      id: ld_has_target
      name: "Garage Occupancy"
      # Long delayed_off on purpose: this sensor's job is to VETO closing, so
      # it must be slow to say "nobody here" and instant to say "someone is".
      filters:
        - delayed_off: 20s

  # "Someone is walking up to the door from inside." The dwell filter is what
  # stops a cat, a shadow, or someone crossing the garage from opening it.
  - platform: template
    id: approach_zone
    name: "Garage Inner Approach"
    device_class: motion
    lambda: |-
      return id(ld_moving_dist).has_state()
          && id(ld_moving_dist).state > 0
          && id(ld_moving_dist).state < 200;   // cm from the sensor
    filters:
      - delayed_on: 1500ms
      - delayed_off: 3s
    on_press:
      - if:
          condition:
            and:
              - switch.is_on: auto_open_enabled
              - binary_sensor.is_on: door_closed
              - lambda: 'return (millis() - id(last_cycle_ms)) > ${cycle_cooldown_ms};'
          then:
            - logger.log: "Inner approach - opening"
            - script.execute: pulse_osc

  # --- Is the vehicle actually back? ---------------------------------------
  # "Someone is home" and "the car is home" are different facts. A phone in the
  # living room satisfies a geofence; it does not park a car. These two sensors
  # are what let us tell the difference.

  - platform: template
    id: car_in_bay
    name: "Garage Car Present"
    device_class: presence
    lambda: |-
      if (!id(bay_distance).has_state()) return {};
      // Empty bay reads the far wall; a parked car reads much closer.
      return id(bay_distance).state < 2.0;   // metres - MEASURE YOURS
    filters:
      - delayed_on: 10s      # ignore someone walking through the beam
      - delayed_off: 30s     # ignore a brief dropout

  - platform: ble_presence
    # Beacon under the bike saddle. Replace with your tag's MAC.
    mac_address: AA:BB:CC:DD:EE:FF
    id: bike_in_garage
    name: "Garage Bike Present"
    device_class: presence
    filters:
      - delayed_off: 60s     # BLE advertising is bursty; don't flap

sensor:
  - platform: ultrasonic
    # HC-SR04 aimed at the parked car's roof or bonnet.
    # NOTE: the echo pin is 5V - use a divider, or a 3.3V-safe module.
    trigger_pin: GPIO18
    echo_pin: GPIO19
    id: bay_distance
    name: "Garage Bay Distance"
    update_interval: 5s
    timeout: 5m
    filters:
      - median:
          window_size: 5
          send_every: 3

  - platform: ld2410
    moving_distance:
      id: ld_moving_dist
      name: "Garage Moving Distance"
    still_distance:
      id: ld_still_dist
      name: "Garage Still Distance"

  - platform: wifi_signal
    name: "Garage Wi-Fi Signal"
    update_interval: 120s

# =============================================================================
#  Logic
# =============================================================================
button:
  # Entry point for triggers that live in ANOTHER ROOM and therefore cannot be
  # wired to this node - a hallway or living-room presence sensor, a contact on
  # the car-key hook, a morning routine. Home Assistant presses this.
  #
  # It is a *speculative* open on purpose: the earlier we trigger, the more
  # likely we are wrong, and speculative opens undo themselves after 90s.
  # That is what makes triggering 30s early affordable.
  - platform: template
    name: "Garage Speculative Open"
    id: btn_speculative_open
    icon: mdi:garage-open-variant
    on_press:
      - if:
          condition:
            and:
              - switch.is_on: auto_open_enabled
              - binary_sensor.is_on: door_closed
              - lambda: 'return (millis() - id(last_cycle_ms)) > ${cycle_cooldown_ms};'
          then:
            - logger.log: "Remote speculative open"
            - lambda: 'id(speculative_open) = true;'
            - script.execute: pulse_osc
          else:
            - logger.log: "Speculative open ignored - not closed, or cooling down"

script:
  # The only thing that ever touches the relay.
  - id: pulse_osc
    mode: single
    then:
      - switch.turn_on: osc_relay
      - delay: ${pulse_length}
      - switch.turn_off: osc_relay
      - lambda: 'id(last_cycle_ms) = millis();'

  # Shared close path. Nothing closes the door except this script, and it
  # re-checks every condition from scratch immediately before moving.
  - id: close_now
    mode: single
    then:
      - if:
          condition:
            and:
              - switch.is_on: auto_close_enabled
              - binary_sensor.is_on: door_open
              - binary_sensor.is_off: beam_blocked
              - binary_sensor.is_off: approach_zone
              - binary_sensor.is_off: ld_has_target
          then:
            - logger.log: "Doorway clear - closing"
            - switch.turn_on: buzzer          # pre-warn before anything moves
            - delay: 3s
            - switch.turn_off: buzzer
            - lambda: 'id(speculative_open) = false;'
            - script.execute: pulse_osc
          else:
            - logger.log: "Close aborted - doorway not clear"

  # Something passed through the doorway. Now wait until it is genuinely safe
  # to close - which means two different things depending on which way it went,
  # handled by ONE rule so we never have to detect direction:
  #
  #   Drove OUT - the person left with the vehicle, so the garage is already
  #               empty. The occupancy wait passes instantly and we close.
  #   Drove IN  - the person is still in the garage, getting out of the car,
  #               unloading shopping. Occupancy holds us off until they have
  #               walked into the house. THEN we close.
  #
  # Same code path, no direction sensing, no second beam. The door simply never
  # closes while a person is in the garage - which is also the safe rule.
  - id: wait_clear_then_close
    mode: restart
    then:
      - logger.log: "Passage detected - waiting for doorway to clear"
      - wait_until:
          condition:
            binary_sensor.is_off: beam_blocked
      - delay: ${clear_dwell}
      - logger.log: "Doorway clear - waiting for the garage to empty of people"
      - wait_until:
          condition:
            and:
              - binary_sensor.is_off: ld_has_target
              - binary_sensor.is_off: approach_zone
              - binary_sensor.is_off: beam_blocked
          timeout: ${occupancy_timeout}
      # Settle, then re-confirm. close_now checks everything again anyway.
      - delay: ${empty_settle}
      - if:
          condition:
            binary_sensor.is_off: ld_has_target
          then:
            - script.execute: close_now
          else:
            - logger.log: "Someone is still in the garage - leaving door open"

  # Armed when the door reaches its open limit. Branches on WHY it opened.
  #
  #   speculative (house door)  -> short leash. If nobody drives out, close
  #                                again. We guessed; the guess was wrong.
  #   commanded (remote/app/HA) -> long leash. If nobody drives out, LEAVE IT
  #                                OPEN. A person asked for this; do not
  #                                second-guess them by closing the door.
  #
  # Either way: nothing closes without a confirmed clear doorway.
  - id: auto_close_watch
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(speculative_open);'
          then:
            - logger.log: "Speculative open - watching (short leash)"
            - wait_until:
                condition:
                  binary_sensor.is_on: beam_blocked
                timeout: ${speculative_timeout}
            - if:
                condition:
                  binary_sensor.is_on: beam_blocked
                then:
                  - lambda: 'id(speculative_open) = false;'
                  - script.execute: wait_clear_then_close
                else:
                  - logger.log: "Speculative open unused - closing again"
                  - script.execute: close_now
          else:
            - logger.log: "Commanded open - watching for passage"
            - wait_until:
                condition:
                  binary_sensor.is_on: beam_blocked
                timeout: ${passage_timeout}
            - if:
                condition:
                  binary_sensor.is_on: beam_blocked
                then:
                  - script.execute: wait_clear_then_close
                else:
                  - logger.log: "No passage within timeout - leaving door open"

# =============================================================================
#  Cover entity for Home Assistant
# =============================================================================
cover:
  - platform: template
    name: "Garage Door"
    id: garage_door
    device_class: garage
    lambda: |-
      if (id(door_closed).state) return COVER_CLOSED;
      return COVER_OPEN;
    open_action:
      - if:
          condition:
            binary_sensor.is_on: door_closed
          then:
            - script.execute: pulse_osc
    close_action:
      - if:
          condition:
            binary_sensor.is_on: door_open
          then:
            - script.execute: pulse_osc
    stop_action:
      - script.execute: pulse_osc
